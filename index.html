<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import * as CANNON from 'cannon-es';

// =====================================================================
//  BASE
// =====================================================================
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const _v1=V(),_v2=V(),_v3=V(),_q1=new THREE.Quaternion();

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled=true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);
const vrBtn=VRButton.createButton(renderer);document.body.appendChild(vrBtn);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87b5e0);
scene.fog=new THREE.Fog(0x87b5e0,60,160);
scene.add(new THREE.HemisphereLight(0xffffff,0x4a6b3a,1.1));
const sun=new THREE.DirectionalLight(0xffffff,1.2);sun.position.set(30,50,20);scene.add(sun);

const dolly=new THREE.Group();dolly.position.set(0,0,3);scene.add(dolly);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,300);camera.position.set(0,1.65,0);dolly.add(camera);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

const world=new CANNON.World({gravity:new CANNON.Vec3(0,-9.82,0)});
world.broadphase=new CANNON.SAPBroadphase(world);
world.allowSleep=true;
world.defaultContactMaterial.friction=.4;
world.defaultContactMaterial.restitution=.05;
world.solver.iterations=8;

// materiali condivisi
const M={};
const mat=(name,col)=>M[name]||(M[name]=new THREE.MeshLambertMaterial({color:col}));
mat('skin',0xe7dccb);mat('broken',0xd9534f);mat('gun',0x1f2937);mat('wall',0xb8bec7);mat('crate',0xa16207);mat('ground',0x4f7d3d);mat('path',0xc9b48a);mat('ammo',0xca8a04);mat('band',0xdc2626);mat('ally',0x22c55e);

// =====================================================================
//  MONDO STATICO
// =====================================================================
const statics=[];      // mesh per raycast (vista e proiettili)
const aabbs=[];        // collisioni a terra per giocatore e Marcelli
const coverPts=[];
{
  const g=new THREE.Mesh(new THREE.PlaneGeometry(240,240),M.ground);g.rotation.x=-Math.PI/2;scene.add(g);statics.push(g);
  const gb=new CANNON.Body({mass:0,shape:new CANNON.Plane()});gb.quaternion.setFromEuler(-Math.PI/2,0,0);world.addBody(gb);
  const p1=new THREE.Mesh(new THREE.PlaneGeometry(3,60),M.path);p1.rotation.x=-Math.PI/2;p1.position.y=.01;scene.add(p1);
  const p2=p1.clone();p2.rotation.z=Math.PI/2;scene.add(p2);
}
function addBox(x,y,z,w,h,d,m=M.wall,cover=true){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);mesh.position.set(x,y+h/2,z);scene.add(mesh);statics.push(mesh);
  const b=new CANNON.Body({mass:0,shape:new CANNON.Box(new CANNON.Vec3(w/2,h/2,d/2))});b.position.set(x,y+h/2,z);world.addBody(b);
  aabbs.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2,h:y+h});
  if(cover&&h>=1){const o=.7;for(const [cx,cz] of [[x-w/2-o,z],[x+w/2+o,z],[x,z-d/2-o],[x,z+d/2+o]])coverPts.push(new THREE.Vector3(cx,0,cz));}
  return mesh;}
function house(x,z,w,d,door){ // muri alti 2.8 con porta larga 1.6
  const T=.25,H=2.8,G=1.6;
  const side=(s,cx,cz,len,hz)=>{if(door===s){const a=(len-G)/2;
      if(hz){addBox(cx-len/2+a/2,0,cz,a,H,T);addBox(cx+len/2-a/2,0,cz,a,H,T);addBox(cx,2.2,cz,G,.6,T,M.wall,false);}
      else{addBox(cx,0,cz-len/2+a/2,T,H,a);addBox(cx,0,cz+len/2-a/2,T,H,a);addBox(cx,2.2,cz,T,.6,G,M.wall,false);}}
    else hz?addBox(cx,0,cz,len,H,T):addBox(cx,0,cz,T,H,len);};
  side('n',x,z-d/2,w,true);side('s',x,z+d/2,w,true);side('w',x-w/2,z,d,false);side('e',x+w/2,z,d,false);
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(w,d),M.path);fl.rotation.x=-Math.PI/2;fl.position.set(x,.02,z);scene.add(fl);}
// fontana
{const f=new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.4,.7,24),new THREE.MeshLambertMaterial({color:0x9ca3af}));f.position.set(0,.35,-12);scene.add(f);statics.push(f);
 const w=new THREE.Mesh(new THREE.CylinderGeometry(1.9,1.9,.05,24),new THREE.MeshLambertMaterial({color:0x0891b2}));w.position.set(0,.68,-12);scene.add(w);
 const b=new CANNON.Body({mass:0,shape:new CANNON.Cylinder(2.3,2.3,.7,16)});b.position.set(0,.35,-12);world.addBody(b);aabbs.push({x0:-2.3,x1:2.3,z0:-14.3,z1:-9.7,h:.7});}
house(-18,-10,8,6,'e');house(18,-10,8,6,'w');house(-20,14,7,7,'e');house(20,14,8,6,'w');
house(0,-45,11,8,'s'); // covo dei malviventi
for(const [x,z,r] of [[-7,-4,0],[7,-4,0],[-9,-18,1],[9,-18,1],[-4,-28,0],[5,-30,0],[-12,4,1],[12,4,1]])r?addBox(x,0,z,.3,1.2,3):addBox(x,0,z,3,1.2,.3);
for(const [x,z] of [[-28,-25],[28,-25],[-30,30],[30,30],[0,25],[-35,0],[35,0]])addBox(x,0,z,2,2,2);
for(let k=0;k<26;k++){const x=rnd(-70,70),z=rnd(-70,70);if(Math.hypot(x,z)<35)continue;const t=new THREE.Mesh(new THREE.CylinderGeometry(.25,.3,2.5,6),new THREE.MeshLambertMaterial({color:0x6b4423}));t.position.set(x,1.25,z);scene.add(t);
  const c=new THREE.Mesh(new THREE.ConeGeometry(1.6,3.5,7),new THREE.MeshLambertMaterial({color:0x1f5f2c}));c.position.set(x,3.6,z);scene.add(c);statics.push(t);
  const b=new CANNON.Body({mass:0,shape:new CANNON.Box(new CANNON.Vec3(.3,1.25,.3))});b.position.set(x,1.25,z);world.addBody(b);aabbs.push({x0:x-.35,x1:x+.35,z0:z-.35,z1:z+.35,h:2.5});}
// tavolo delle armi
addBox(0,0,1.6,2.4,.9,.7,new THREE.MeshLambertMaterial({color:0x6b4f35}),false);

// cartello istruzioni
function textPlane(w,h,cw,ch){const c=document.createElement('canvas');c.width=cw;c.height=ch;const tex=new THREE.CanvasTexture(c);const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex,transparent:true}));m.userData.canvas=c;m.userData.tex=tex;return m;}
{const s=textPlane(2.4,1.25,768,400);s.position.set(0,2.15,.9);scene.add(s);const g=s.userData.canvas.getContext('2d');
 g.fillStyle='rgba(15,23,42,.88)';g.fillRect(0,0,768,400);g.fillStyle='#22d3ee';g.font='bold 40px sans-serif';g.fillText('MARCELLI VR — prova',24,52);
 g.fillStyle='#e5e7eb';g.font='25px sans-serif';
 ['Levetta sinistra: cammina (premila per correre)','Levetta destra: gira','GRILLETTO LATERALE: afferra (anche da lontano, puntando)','Grilletto indice: spara · A / X: ricarica','Y: spawn civile · B: spawn malvivente','Le armi e le munizioni sono sul tavolo davanti a te','Un Marcello amico ti offre la mano: stringila = patto'].forEach((t,i)=>g.fillText('• '+t,24,100+i*42));
 s.userData.tex.needsUpdate=true;}

function blocked(x,z,r){for(const a of aabbs){if(a.h<.5)continue;if(x+r>a.x0&&x-r<a.x1&&z+r>a.z0&&z-r<a.z1)return true;}return false;}
function pushOut(p,r){for(const a of aabbs){if(a.h<.4)continue;const cx=clamp(p.x,a.x0,a.x1),cz=clamp(p.z,a.z0,a.z1);let dx=p.x-cx,dz=p.z-cz;const d=Math.hypot(dx,dz);
  if(d<r){if(d>1e-6){p.x+=dx/d*(r-d);p.z+=dz/d*(r-d);}else{const l=p.x-a.x0,rr=a.x1-p.x,t=p.z-a.z0,b=a.z1-p.z,m=Math.min(l,rr,t,b);if(m===l)p.x=a.x0-r;else if(m===rr)p.x=a.x1+r;else if(m===t)p.z=a.z0-r;else p.z=a.z1+r;}}}
  p.x=clamp(p.x,-110,110);p.z=clamp(p.z,-110,110);}
const ray=new THREE.Raycaster();
function losClear(a,b){_v1.subVectors(b,a);const d=_v1.length();if(d<.01)return true;ray.set(a,_v1.divideScalar(d));ray.far=d;return ray.intersectObjects(statics,false).length===0;}

// =====================================================================
//  SUONO
// =====================================================================
let AC=null,noise=null;
function audio(){if(AC)return;try{AC=new AudioContext();const n=AC.sampleRate*.4;noise=AC.createBuffer(1,n,AC.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);}catch(e){}}
function bang(pos,loud=1,lp=2400){if(!AC)return;const d=pos.distanceTo(camWorld());const v=clamp(1-d/70,0,1)*.5*loud;if(v<.02)return;const s=AC.createBufferSource();s.buffer=noise;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;const g=AC.createGain();g.gain.value=v;s.connect(f).connect(g).connect(AC.destination);s.start();}
function camWorld(t=V()){return camera.getWorldPosition(t);}

// =====================================================================
//  ARMI E OGGETTI AFFERRABILI
// =====================================================================
const GUNS={
  pistola:{n:'Pistola',auto:false,rate:.14,mag:15,dmg:34,imp:9,spread:.008,pellets:1,ammo:'9mm',len:.17,loud:.8},
  fucile:{n:"Fucile d'assalto",auto:true,rate:.1,mag:30,dmg:30,imp:11,spread:.014,pellets:1,ammo:'5.56',len:.55,loud:1},
  pompa:{n:'Fucile a pompa',auto:false,rate:.75,mag:6,dmg:16,imp:16,spread:.06,pellets:8,ammo:'cal.12',len:.6,loud:1.2},
};
const reserve={'9mm':30,'5.56':0,'cal.12':0};
const grabbables=[]; // {kind:'gun'|'crate'|'ammo', mesh, body, ...}
function gunMesh(id){const G=GUNS[id];const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(.04,.05,G.len),M.gun);body.position.set(0,.03,-G.len/2+.05);g.add(body);
  const grip=new THREE.Mesh(new THREE.BoxGeometry(.035,.11,.045),M.gun);grip.position.set(0,-.03,.03);grip.rotation.x=-.25;g.add(grip);
  if(id!=='pistola'){const st=new THREE.Mesh(new THREE.BoxGeometry(.04,.07,.2),M.gun);st.position.set(0,.01,.17);g.add(st);}
  if(id==='fucile'){const sc=new THREE.Mesh(new THREE.BoxGeometry(.03,.03,.1),new THREE.MeshLambertMaterial({color:0x111111}));sc.position.set(0,.07,-.1);g.add(sc);const dot=new THREE.Mesh(new THREE.BoxGeometry(.006,.006,.002),new THREE.MeshBasicMaterial({color:0xff2020}));dot.position.set(0,.07,-.046);g.add(dot);}
  if(id==='pompa'){const pump=new THREE.Mesh(new THREE.BoxGeometry(.05,.04,.14),mat('pump',0x5b3a1e));pump.position.set(0,0,-G.len+.25);g.add(pump);}
  const muzzle=new THREE.Object3D();muzzle.position.set(0,.03,-G.len+.05);g.add(muzzle);g.userData.muzzle=muzzle;
  return g;}
function spawnGun(id,x,y,z){const mesh=gunMesh(id);mesh.position.set(x,y,z);mesh.rotation.y=rnd(-.3,.3);scene.add(mesh);
  const body=new CANNON.Body({mass:1.2,shape:new CANNON.Box(new CANNON.Vec3(.04,.035,GUNS[id].len/2)),collisionFilterGroup:2,collisionFilterMask:1|2,angularDamping:.5});body.position.set(x,y,z);body.quaternion.copy(mesh.quaternion);world.addBody(body);
  const it={kind:'gun',id,mesh,body,mag:GUNS[id].mag,cool:0,recoil:0};mesh.traverse(o=>o.userData.item=it);grabbables.push(it);return it;}
function spawnCrate(x,y,z,s=.5){const mesh=new THREE.Mesh(new THREE.BoxGeometry(s,s,s),M.crate);mesh.position.set(x,y,z);scene.add(mesh);
  const body=new CANNON.Body({mass:6*s,shape:new CANNON.Box(new CANNON.Vec3(s/2,s/2,s/2))});body.position.set(x,y,z);world.addBody(body);
  const it={kind:'crate',mesh,body};mesh.userData.item=it;grabbables.push(it);statics.push;return it;}
function spawnAmmo(type,n,x,y,z){const mesh=new THREE.Mesh(new THREE.BoxGeometry(.12,.07,.08),M.ammo);mesh.position.set(x,y,z);scene.add(mesh);
  const body=new CANNON.Body({mass:.5,shape:new CANNON.Box(new CANNON.Vec3(.06,.035,.04)),collisionFilterGroup:2,collisionFilterMask:1|2});body.position.set(x,y,z);world.addBody(body);
  const it={kind:'ammo',type,n,mesh,body};mesh.userData.item=it;grabbables.push(it);return it;}
function removeItem(it){const i=grabbables.indexOf(it);if(i>=0)grabbables.splice(i,1);if(it.body)world.removeBody(it.body);it.mesh.parent&&it.mesh.parent.remove(it.mesh);}
spawnGun('pistola',-.8,1.0,1.55);spawnGun('fucile',-.2,1.0,1.55);spawnGun('pompa',.55,1.0,1.55);
spawnAmmo('9mm',30,-.8,1.0,1.8);spawnAmmo('5.56',60,-.25,1.0,1.8);spawnAmmo('5.56',60,-.05,1.0,1.8);spawnAmmo('cal.12',12,.6,1.0,1.8);spawnAmmo('cal.12',12,.8,1.0,1.8);
for(let k=0;k<12;k++)spawnCrate(3+(k%3)*.7,.26+Math.floor(k/6)*.52,-1+Math.floor(k/3)%2*.7+(k>=6?0:0));

// =====================================================================
//  MARCELLI
// =====================================================================
const TYPES={
  civile:{label:'Civile',shirt:0x3b82f6,pants:0x334155,gun:null,cour:[.05,.45],aim:.3,rel:0},
  armato:{label:'Civile armato',shirt:0x60a5fa,pants:0x1e293b,gun:'pistola',cour:[.5,.9],aim:.55,rel:0},
  malvivente:{label:'Malvivente',shirt:0x27272a,pants:0x111827,gun:'pistola',band:true,cour:[.6,1],aim:.5,rel:-100},
};
const PARTS={ // metà dimensioni
  pelvis:[.16,.09,.1],torso:[.18,.22,.11],head:[.11],uArmL:[.05,.14,.05],lArmL:[.045,.15,.045],uArmR:[.05,.14,.05],lArmR:[.045,.15,.045],thighL:[.07,.2,.07],shinL:[.06,.22,.06],thighR:[.07,.2,.07],shinR:[.06,.22,.06]};
const MASS={pelvis:12,torso:20,head:5,uArmL:2.5,lArmL:2,uArmR:2.5,lArmR:2,thighL:8,shinL:5,thighR:8,shinR:5};
const HP0={head:45,torso:100,pelvis:90,uArmL:55,lArmL:50,uArmR:55,lArmR:50,thighL:65,shinL:60,thighR:65,shinR:60};
const JOINTS=[['pelvis','torso','waist',.5],['torso','head','neck',.7],['torso','uArmL','shoulderL',1.4],['uArmL','lArmL','elbowL',1.2],['torso','uArmR','shoulderR',1.4],['uArmR','lArmR','elbowR',1.2],['pelvis','thighL','hipL',1],['thighL','shinL','kneeL',1.1],['pelvis','thighR','hipR',1],['thighR','shinR','kneeR',1.1]];
const PNAME={head:'la testa',torso:'il torace',pelvis:'il bacino',uArmL:'il braccio sinistro',lArmL:'l\'avambraccio sinistro',uArmR:'il braccio destro',lArmR:'l\'avambraccio destro',thighL:'la coscia sinistra',shinL:'la gamba sinistra',thighR:'la coscia destra',shinR:'la gamba destra'};
const geoCache={};
function partGeo(p){if(geoCache[p])return geoCache[p];const d=PARTS[p];return geoCache[p]=d.length===1?new THREE.SphereGeometry(d[0],12,10):new THREE.BoxGeometry(d[0]*2,d[1]*2,d[2]*2);}
const marcelli=[];const partMeshes=[];
const SURN=['Rossi','Bianchi','Esposito','Romano','Colombo','Ricci','Marino','Greco','Bruno','Gallo','Conti','De Luca','Costa','Giordano','Rizzo','Moretti','Fontana','Caruso','Leone','Serra'];
let groupId=1;
function makeMarcello(type,x,z,group){
  const T=TYPES[type];const root=new THREE.Group();root.position.set(x,0,z);root.rotation.y=rnd(6.28);scene.add(root);
  const o=(parent,px,py,pz)=>{const j=new THREE.Object3D();j.position.set(px,py,pz);parent.add(j);return j;};
  const J={};J.hips=o(root,0,.95,0);J.waist=o(J.hips,0,.08,0);J.neck=o(J.waist,0,.46,0);
  J.shoulderL=o(J.waist,-.25,.4,0);J.elbowL=o(J.shoulderL,0,-.29,0);J.shoulderR=o(J.waist,.25,.4,0);J.elbowR=o(J.shoulderR,0,-.29,0);
  J.hipL=o(J.hips,-.09,-.07,0);J.kneeL=o(J.hipL,0,-.41,0);J.hipR=o(J.hips,.09,-.07,0);J.kneeR=o(J.hipR,0,-.41,0);
  const shirt=mat('s'+T.shirt,T.shirt),pants=mat('p'+T.pants,T.pants);
  const m={type,T,name:'Marcello '+pick(SURN),root,J,parts:{},hp:{...HP0},st:{},alive:true,rag:null,downT:0,
    vel:V(),phase:rnd(6),state:'wander',thinkT:rnd(.3),goal:null,alertT:0,heard:null,target:null,lastSeen:null,cool:rnd(1),
    cour:rnd(T.cour[0],T.cour[1]),aim:T.aim,relP:T.rel,group,ally:false,offer:false,gun:null,gunMesh:null,mag:0,hitT:0,impAcc:0,
    sayT:0,bubble:null,deadT:0,back:false,limp:0,wanderT:rnd(1,4),home:new THREE.Vector3(x,0,z),bleed:0};
  const add=(p,parent,px,py,pz,mt)=>{const mesh=new THREE.Mesh(partGeo(p),mt);mesh.position.set(px,py,pz);parent.add(mesh);mesh.userData.m=m;mesh.userData.part=p;mesh.userData.home={parent,pos:mesh.position.clone(),quat:mesh.quaternion.clone(),mat:mt};m.parts[p]=mesh;m.st[p]='ok';partMeshes.push(mesh);};
  add('pelvis',J.hips,0,0,0,pants);add('torso',J.waist,0,.22,0,shirt);add('head',J.neck,0,.12,0,M.skin);
  add('uArmL',J.shoulderL,0,-.14,0,shirt);add('lArmL',J.elbowL,0,-.15,0,M.skin);add('uArmR',J.shoulderR,0,-.14,0,shirt);add('lArmR',J.elbowR,0,-.15,0,M.skin);
  add('thighL',J.hipL,0,-.2,0,pants);add('shinL',J.kneeL,0,-.22,0,pants);add('thighR',J.hipR,0,-.2,0,pants);add('shinR',J.kneeR,0,-.22,0,pants);
  // naso (per guardare dove guarda)
  const nose=new THREE.Mesh(new THREE.BoxGeometry(.03,.04,.04),M.skin);nose.position.set(0,0,.11);m.parts.head.add(nose);
  if(T.band){const b=new THREE.Mesh(new THREE.BoxGeometry(.23,.05,.23),M.band);b.position.y=.04;m.parts.head.add(b);}
  if(T.gun)giveGun(m,T.gun);
  marcelli.push(m);return m;}
function giveGun(m,id){m.gun=id;m.mag=GUNS[id].mag;m.reserveAmmo=GUNS[id].mag*2;const g=gunMesh(id);g.rotation.x=-Math.PI/2;g.position.set(0,-.13,.03);m.parts.lArmR.add(g);m.gunMesh=g;}

  for(const [a,b,jn] of JOINTS)jp[jn]=m.J[jn].getWorldPosition(V());
  for(const p in wp){const d=PARTS[p];const shape=d.length===1?new CANNON.Sphere(d[0]):new CANNON.Box(new CANNON.Vec3(d[0],d[1],d[2]));
    const b=new CANNON.Body({mass:MASS[p],shape,linearDamping:.08,angularDamping:.4});b.position.copy(wp[p]);b.quaternion.copy(wq[p]);b.velocity.set(m.vel.x,0,m.vel.z);b.userData={m,part:p};

    const ax=_v3.copy(wp[b]).sub(J).normalize();const axA=ax.clone().applyQuaternion(qa),axB=ax.clone().applyQuaternion(qb);
    const c=new CANNON.ConeTwistConstraint(A,B,{pivotA:new CANNON.Vec3(pa.x,pa.y,pa.z),pivotB:new CANNON.Vec3(pb.x,pb.y,pb.z),axisA:new CANNON.Vec3(axA.x,axA.y,axA.z),axisB:new CANNON.Vec3(axB.x,axB.y,axB.z),angle:ang,twistAngle:.5,collideConnected:false});
    world.addConstraint(c);rag.cons[jn]=c;}
  m.rag=rag;if(m.bubble)m.bubble.visible=false;return rag;}
function root_updateMatrices(m){m.root.updateMatrixWorld(true);}
function fromRagdoll(m){ // si rialza
  const rag=m.rag;if(!rag)return;const pel=rag.bodies.pelvis,tor=rag.bodies.torso;

function attachedToBody(m,p){ // la parte è ancora collegata al bacino?
  const chain={head:['neck'],torso:['waist'],uArmL:['shoulderL','waist'],lArmL:['elbowL','shoulderL','waist'],uArmR:['shoulderR','waist'],lArmR:['elbowR','shoulderR','waist'],thighL:['hipL'],shinL:['kneeL','hipL'],thighR:['hipR'],shinR:['kneeR','hipR'],pelvis:[]};

function onRagImpact(m,p,e){const v=Math.abs(e.contact.getImpactVelocityAlongNormal());if(v<6.5)return;

function detach(m,p){

const bloodPool=[];const bloodGeo=new THREE.CircleGeometry(1,10);const bloodMat=new THREE.MeshBasicMaterial({color:0x7f1d1d,transparent:true,opacity:.8});
function blood(p,s=.12){const b=new THREE.Mesh(bloodGeo,bloodMat);b.rotation.x=-Math.PI/2;b.position.set(p.x+rnd(-.2,.2),.015+Math.random()*.004,p.z+rnd(-.2,.2));b.scale.setScalar(s*rnd(.7,1.3));scene.add(b);bloodPool.push(b);if(bloodPool.length>200)scene.remove(bloodPool.shift());}
function damage(m,p,d,attacker,big){
  if(m.st[p]==='staccato'||m.st[p]==='staccato_con')return;
  m.hp[p]-=d;m.bleed+=d*.01;
  const legs=['thighL','shinL','thighR','shinR'],arms=['uArmL','lArmL','uArmR','lArmR'];
  if(p==='head'||p==='torso'||p==='pelvis'){if(m.hp[p]<=0){if(p==='head'&&big&&m.hp[p]<-30)detach(m,'head');die(m,attacker);return;}}
  if(m.hp[p]<=0&&m.st[p]==='ok'||m.hp[p]<=0&&m.st[p]==='rotto'&&m.hp[p]>-35){if(m.st[p]!=='rotto'){m.st[p]='rotto';m.parts[p].material=M.broken;
      if(m.alive)say(m,legs.includes(p)?'La gamba!':'Il braccio!');hud.msg(`Hai rotto ${PNAME[p]} a ${m.name}`);
      if(p==='lArmR'||p==='uArmR')dropNPCGun(m);
      if(legs.includes(p))knockDown(m,2.5);}}
  if(m.hp[p]<=-35&&(arms.includes(p)||legs.includes(p))&&big){detach(m,p);hud.msg(`Hai staccato ${PNAME[p]} a ${m.name}`);if(m.alive){say(m,'AAAAH!');knockDown(m,4);}}

function die(m,attacker){if(!m.alive)return;m.alive=false;m.deadT=0;toRagdoll(m);dropNPCGun(m);blood(m.parts.pelvis.getWorldPosition(V()),.5);hud.msg(`${m.name} è morto${attacker==='player'?' (colpa tua)':''}`);if(m.group)m.group.alive--;}
function hitMarcello(m,p,dmg,imp,dir,point,byPlayer){
  if(!m.parts[p])return;
  const big=imp>=13||dmg>=40;
  m.impAcc+=imp;m.hitT=2;
  blood(point,.08);
  damage(m,p,dmg,byPlayer?'player':null,big);
  if(m.alive&&m.impAcc>30)knockDown(m,2+m.impAcc/25);
  if(m.rag){const b=m.rag.bodies[p];if(b){const s=imp*1.2;b.applyImpulse(new CANNON.Vec3(dir.x*s,dir.y*s+s*.2,dir.z*s),new CANNON.Vec3(point.x-b.position.x,point.y-b.position.y,point.z-b.position.z));}
    for(const q of['torso','pelvis']){const c=m.rag.bodies[q];if(c&&c!==b&&attachedToBody(m,p)){const s=imp*.9;c.applyImpulse(new CANNON.Vec3(dir.x*s,s*.25,dir.z*s),new CANNON.Vec3(0,0,0));}}}
  else{m.vel.addScaledVector(dir,imp*.15);}

  // reazioni

  if(byPlayer){if(m.ally){m.ally=false;m.relP=-100;say(m,'Traditore!');hud.msg(`${m.name} non è più tuo alleato`);}
    else{m.relP=-100;if(m.group&&!m.group.hostile){m.group.hostile=true;if(m.group.size>1)hud.msg(`La comunità "${m.group.name}" ora ti dà la caccia!`);}}
    if(m.group){m.group.lastKnown=camWorld();for(const o of marcelli)if(o.group===m.group&&o.alive){o.alertT=25;o.heard=camWorld();}}}
  else if(m.alive&&Math.random()<.6)say(m,pick(['Ahi!','Mi hanno colpito!']));}

function heard(pos,R,byPlayer){for(const m of marcelli){if(!m.alive)continue;const d=m.root.position.distanceTo(pos);if(d>R)continue;m.alertT=Math.max(m.alertT,14);m.heard=pos.clone();m.heard.y=0;m.thinkT=Math.min(m.thinkT,rnd(.1,.4));if(byPlayer&&!m.ally&&d<8)m.relP-=4;}}
function playerTarget(){const p=camWorld();return{isPlayer:true,pos:p};}
function canSee(m,tpos,R=35){const hp=headPos(m,_v2);const d=hp.distanceTo(tpos);if(d>R)return false;
  _v3.subVectors(tpos,hp).setY(0).normalize();const fwd=V().set(Math.sin(m.root.rotation.y),0,Math.cos(m.root.rotation.y));
  if(d>3&&fwd.dot(_v3)<-.1&&m.alertT<=0)return false;return losClear(hp,tpos);}
function think(m){
  if(!m.alive||m.rag)return;
  const P=camWorld();const dP=m.root.position.distanceTo(_v1.set(P.x,0,P.z));
  let tgt=null;
  if(hostile(m)){if(canSee(m,P))tgt={isPlayer:true,pos:P.clone()};
    if(!tgt)for(const o of marcelli){if(o.ally&&o.alive&&!o.rag&&canSee(m,headPos(o))){tgt={m:o,pos:headPos(o)};break;}}}
  else if(m.ally){let best=null,bd=30;for(const o of marcelli){if(!o.alive||!hostile(o)||o===m)continue;const d=o.root.position.distanceTo(m.root.position);if(d<bd&&canSee(m,headPos(o))){bd=d;best=o;}}if(best)tgt={m:best,pos:headPos(best)};}
  m.target=tgt;if(tgt){m.lastSeen=tgt.pos.clone();m.alertT=Math.max(m.alertT,15);}
  const armed=!!m.gun&&(m.mag>0||m.reserveAmmo>0);const wounded=Object.values(m.st).some(s=>s!=='ok');
  const fear=(m.alertT>0?1:0)*(1-m.cour)+(wounded?.6:0);
  let st;
  if(m.ally&&!tgt)st='follow';
  else if(tgt&&armed&&m.cour>fear*.7)st='attack';
  else if(tgt||(m.alertT>0&&(hostile(m)||!armed))){st=armed&&m.cour>.5?'cover':(dP<3.5&&!hostile(m)?'cower':'flee');}
  else if(m.alertT>0&&armed){st=hostile(m)&&m.group&&m.group.lastKnown?'hunt':'cover';}
  else{st=(!hostile(m)&&!m.ally&&dP<1.9&&m.relP>=0&&m.type!=='malvivente')?'offer':'wander';}
  if(st!==m.state){m.state=st;m.goal=null;
    const L={flee:['Aiuto!','Scappate!','Non sparate!'],cover:['Al riparo!','Da dove spara?'],attack:['Eccolo!','Fuoco!'],cower:['No no no!','Non farmi male!'],hunt:['Andiamo a prenderlo!'],offer:['Facciamo un patto? Qua la mano.'],follow:['Ti seguo.']};
    if(L[st])say(m,pick(L[st]));}
  m.offer=st==='offer';
  // obiettivo di movimento
  const threat=m.lastSeen||m.heard||P;
  if(st==='flee'&&(!m.goal||m.root.position.distanceTo(m.goal)<1.5)){_v1.subVectors(m.root.position,threat).setY(0).normalize();const a=Math.atan2(_v1.x,_v1.z)+rnd(-.6,.6);m.goal=new THREE.Vector3(m.root.position.x+Math.sin(a)*rnd(12,20),0,m.root.position.z+Math.cos(a)*rnd(12,20));}
  if(st==='cover'&&!m.goal){m.goal=findCover(m,threat)||m.root.position.clone();}
  if(st==='attack'){const d=m.root.position.distanceTo(_v1.set(threat.x,0,threat.z));m.goal=d>18?new THREE.Vector3(threat.x,0,threat.z):(m.hitT>0&&Math.random()<.3?findCover(m,threat):null);}
  if(st==='hunt'){const lk=m.group.lastKnown;m.goal=new THREE.Vector3(lk.x+rnd(-2,2),0,lk.z+rnd(-2,2));if(m.root.position.distanceTo(m.goal)<2){m.group.lastKnown=null;}}
  if(st==='follow'){const d=dP;m.goal=d>3?new THREE.Vector3(P.x+rnd(-1,1),0,P.z+rnd(-1,1)):null;}
  if(st==='wander'){m.wanderT-=.25;if(m.wanderT<=0||!m.goal){m.wanderT=rnd(3,8);m.goal=Math.random()<.35?null:new THREE.Vector3(m.home.x+rnd(-8,8),0,m.home.z+rnd(-8,8));}}
  if(st==='cower'||st==='offer')m.goal=null;}
function findCover(m,threat){let best=null,bd=14;const hp=_v2;for(const c of coverPts){const d=c.distanceTo(m.root.position);if(d>bd)continue;hp.set(c.x,1,c.z);if(losClear(_v3.set(threat.x,1.3,threat.z),hp))continue;bd=d;best=c;}return best&&best.clone();}
function act(m,dt){
  m.sayT-=dt;if(m.bubble){if(m.sayT<=0)m.bubble.visible=false;else if(!m.rag){headPos(m,m.bubble.position);m.bubble.position.y+=.38;m.bubble.lookAt(camWorld());}}
  m.hitT-=dt;m.impAcc=Math.max(0,m.impAcc-dt*12);if(m.alertT>0)m.alertT-=dt;else{m.heard=null;m.lastSeen=null;}
  if(m.alive&&m.bleed>0){m.hp.torso-=m.bleed*dt*.6;m.bleed=Math.max(0,m.bleed-dt*.05);if(m.hp.torso<=0)die(m,null);}
  if(m.rag){if(m.alive){m.downT-=dt;const legsOk=m.st.thighL==='ok'||m.st.thighL==='rotto';const canStand=['thighL','shinL','thighR','shinR'].every(p=>m.st[p]!=='staccato'&&m.st[p]!=='staccato_con')&&m.st.pelvis!=='staccato';
      if(m.downT<=0&&canStand&&!m.grabbed){fromRagdoll(m);say(m,'Ahia...');}else if(m.downT<=0&&!canStand&&Math.random()<dt*.3)say(m,pick(['Aiuto...','Non sento la gamba...']));}
    return;}
  if(!m.alive)return;
  m.cool-=dt;
  const st=m.state;let speed=0;const pos=m.root.position;
  // sparo
  if(m.target&&m.gun&&(st==='attack'||st==='cover'||st==='follow')){
    _v1.subVectors(m.target.pos,pos);const yaw=Math.atan2(_v1.x,_v1.z);m.root.rotation.y+=angDiff(yaw,m.root.rotation.y)*Math.min(1,dt*8);
    if(m.mag<=0&&m.reserveAmmo>0&&m.cool<=0){m.cool=2;const k=Math.min(m.reserveAmmo,GUNS[m.gun].mag);m.mag=k;m.reserveAmmo-=k;say(m,'Ricarico!');}
    else if(m.cool<=0&&m.mag>0&&Math.abs(angDiff(yaw,m.root.rotation.y))<.3)npcShoot(m);}
  if(m.goal){_v1.subVectors(m.goal,pos).setY(0);const d=_v1.length();if(d>.6){_v1.divideScalar(d);const run=st==='flee'||st==='cover'||st==='hunt'||(st==='follow'&&d>8)||(st==='attack');speed=(run?3.8:1.3);
      if(!m.target||st==='flee')m.root.rotation.y+=angDiff(Math.atan2(_v1.x,_v1.z),m.root.rotation.y)*Math.min(1,dt*6);}else m.goal=st==='wander'?null:m.goal;}
  if(st==='offer'||st==='cower'){_v1.subVectors(camWorld(),pos);m.root.rotation.y+=angDiff(Math.atan2(_v1.x,_v1.z),m.root.rotation.y)*Math.min(1,dt*5);}
  // ferite alle gambe
  const leg=s=>s==='rotto'?.4:1;let lm=leg(m.st.thighL)*leg(m.st.shinL)*leg(m.st.thighR)*leg(m.st.shinR);if(m.back)lm*=.6;speed*=Math.max(.25,lm);m.limp=lm<1?1:0;
  // movimento con separazione
  const fx=Math.sin(m.root.rotation.y),fz=Math.cos(m.root.rotation.y);
  let tx=0,tz=0;if(speed>0&&m.goal){_v1.subVectors(m.goal,pos).setY(0).normalize();tx=_v1.x*speed;tz=_v1.z*speed;}
  for(const o of marcelli){if(o===m||!o.alive||o.rag)continue;const dx=pos.x-o.root.position.x,dz=pos.z-o.root.position.z,dd=dx*dx+dz*dz;if(dd<.36&&dd>1e-6){const d=Math.sqrt(dd);tx+=dx/d*(.6-d)*6;tz+=dz/d*(.6-d)*6;}}
  m.vel.x+=(tx-m.vel.x)*Math.min(1,dt*6);m.vel.z+=(tz-m.vel.z)*Math.min(1,dt*6);
  pos.x+=m.vel.x*dt;pos.z+=m.vel.z*dt;pushOut(pos,.3);
  animate(m,dt);}
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;}
function npcShoot(m){const G=GUNS[m.gun];m.mag--;m.cool=G.rate*rnd(2.5,5);
  const muzzle=m.gunMesh.userData.muzzle.getWorldPosition(V());
  const aimAt=m.target.isPlayer?camWorld().add(V().set(0,-.25,0)):m.target.pos.clone();
  const dir=aimAt.clone().sub(muzzle).normalize();const err=(1-m.aim)*.08+(m.limp?.03:0)+.01;
  dir.x+=rnd(-err,err);dir.y+=rnd(-err,err)*.6;dir.z+=rnd(-err,err);dir.normalize();

function animate(m,dt){const J=m.J;const sp=Math.hypot(m.vel.x,m.vel.z);m.phase+=dt*(2+sp*2.6);const k=Math.min(1,sp/3.5);
  const sw=Math.sin(m.phase)*(.25+k*.45);

  let hipY=.95,armL=-sw*.8,armR=sw*.8,elbL=-.2,elbR=-.2,armLz=0,armRz=0,kneeBend=0;

  const st=m.state;
  if(st==='cower'){hipY=.62;kneeBend=1.6;armL=-2.7;armR=-2.7;elbL=-1.6;elbR=-1.6;armLz=-.3;armRz=.3;}
  else if(st==='cover'&&sp<.3&&!m.target){hipY=.7;kneeBend=1.3;}
  if(m.target&&m.gun&&(st==='attack'||st==='cover'||st==='follow')){armR=-Math.PI/2;elbR=0;armL=-1.2;elbL=-.9;armLz=.5;
    _v1.subVectors(m.target.pos,headPos(m,_v2));armR-=Math.atan2(_v1.y,Math.hypot(_v1.x,_v1.z))*.8;}
  if(st==='offer'){armR=-1.1;elbR=-.3;}

  lerp(J.kneeL,'x',kneeBend+Math.max(0,Math.sin(m.phase+.6))*.9*k);lerp(J.kneeR,'x',kneeBend+Math.max(0,-Math.sin(m.phase+.6))*.9*k);

  if(m.st.uArmR!=='rotto'){lerp(J.shoulderR,'x',armR);lerp(J.shoulderR,'z',armRz);lerp(J.elbowR,'x',elbR);}else{lerp(J.shoulderR,'x',.1);lerp(J.elbowR,'x',.4);}
  J.hips.position.y+=(hipY-J.hips.position.y)*Math.min(1,dt*8)+(m.limp?Math.abs(Math.sin(m.phase))*.003:0);
  J.waist.rotation.x=m.back?.35:(st==='cower'?.4:0);}

function shoot(origin,dir,G,shooter){

function locomotion(dt){

  dolly.position.x+=after.x-before.x;dolly.position.z+=after.z-before.z;
  if(turn){ // ruota attorno alla testa
    const hx=head.x,hz=head.z;dolly.rotation.y+=turn;dolly.updateMatrixWorld(true);const nh=camWorld(_v3);dolly.position.x+=hx-nh.x;dolly.position.z+=hz-nh.z;}}
function tick(){
  const dt=Math.min(clock.getDelta(),.05);
  fpsN++;fpsT+=dt;if(fpsT>.5){fps=fpsN/fpsT;fpsN=0;fpsT=0;}
  if(player.dead>0){player.dead-=dt;if(player.dead<=0){player.hp=100;dolly.position.set(0,0,3);}}
  else{locomotion(dt);player.hp=Math.min(100,player.hp+dt*2);}
  redSphere.material.opacity=Math.max(0,redSphere.material.opacity-dt*1.2);
  updateHands(dt);
  world.step(1/72,dt,3);
  for(const it of grabbables){if(it.held&&it.kind==='gun')continue;if(it.body){it.mesh.position.copy(it.body.position);it.mesh.quaternion.copy(it.body.quaternion);}}
  for(const m of marcelli){m.thinkT-=dt;if(m.thinkT<=0){m.thinkT=rnd(.2,.35);think(m);}act(m,dt);
    if(m.rag)for(const p in m.rag.bodies){const b=m.rag.bodies[p],mesh=m.parts[p];mesh.position.copy(b.position);mesh.quaternion.copy(b.quaternion);}
    if(!m.alive){m.deadT+=dt;}}
  // corpi che scompaiono dopo 60 s
  for(let i=marcelli.length-1;i>=0;i--){const m=marcelli[i];if(!m.alive&&m.deadT>60&&!m.grabbed)removeMarcello(m,i);}
  for(let i=tracers.length-1;i>=0;i--){const t=tracers[i];t.t-=dt;if(t.t<=0){scene.remove(t.l);t.l.geometry.dispose();t.l.material.dispose();tracers.splice(i,1);}}
  if(flashT>0){flashT-=dt;if(flashT<=0)flashMesh.visible=false;}
  hud.t-=dt;if(hud.t<=0){hud.t=.25;for(const m of hud.msgs)m.ttl-=.25;hud.msgs=hud.msgs.filter(m=>m.ttl>0);drawHud();if(desk.on)deskInfo();}
  renderer.render(scene,camera);}
function removeMarcello(m,i){if(m.rag){for(const jn in m.rag.cons)world.removeConstraint(m.rag.cons[jn]);for(const p in m.rag.bodies)world.removeBody(m.rag.bodies[p]);}
  for(const p in m.parts){const mesh=m.parts[p];mesh.parent&&mesh.parent.remove(mesh);const k=partMeshes.indexOf(mesh);if(k>=0)partMeshes.splice(k,1);}
  scene.remove(m.root);if(m.bubble)scene.remove(m.bubble);marcelli.splice(i,1);}
const infoEl=document.getElementById('info');const infoBase=infoEl.innerHTML;
function deskInfo(){const held=desk.hand.held;infoEl.innerHTML=infoBase+`<br><span style="color:#fde68a">${held&&held.kind==='gun'?GUNS[held.id].n+' '+held.mag+'/'+GUNS[held.id].mag:'mani libere'} · HP ${player.hp|0} · Marcelli ${marcelli.filter(m=>m.alive).length} · ${fps|0} fps<br>${hud.msgs.map(m=>m.t).join('<br>')}</span>`;}
document.getElementById('load').remove();
renderer.setAnimationLoop(tick);
// gancio per i test automatici
window.__vr={marcelli,grabbables,hands,desk,player,reserve,spawnInFront,shoot,GUNS,hitMarcello,knockDown,grab,release,camWorld,world,THREE,renderer,dolly,camera,hud,toRagdoll};
</script>
